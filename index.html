<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Zitago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://app.zitago.es/">
  <!-- Fallback when JavaScript is off: lands on the home page. -->
  <meta http-equiv="refresh" content="0; url=https://app.zitago.es/">
  <script>
    // Keep the path (zitago.es/privacidad -> app.zitago.es/privacidad).
    // The origin is fixed, so the URL can't send the visitor anywhere else.
    location.replace('https://app.zitago.es' + location.pathname + location.search + location.hash);
  </script>
</head>
<body>
  <p><a href="https://app.zitago.es/">Ir a Zitago</a></p>
</body>
</html>
